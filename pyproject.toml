[project]
name = "delphi-capacity"
version = "0.1.0"
description = "Calibrated time-series forecasting and auditable capacity control"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lightgbm>=4.6",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scikit-learn>=1.6",
    "sqlalchemy>=2.0",
    "statsforecast>=2.0",
    "structlog>=24.1",
    "tenacity>=8.3",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delphi"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/delphi"]
explicit_package_bases = true

# Scoped per PLAN.md: `ignore_missing_imports` only where stubs genuinely do not exist.
# Both are M17's optional extras, imported only inside `delphi.forecast.foundation`.
# chronos-forecasting ships no py.typed marker; torch is simply absent from CI, which
# installs neither — so this override is what makes the module typecheck identically whether
# the extra is present or not, rather than passing locally and failing on a clean machine.
[[tool.mypy.overrides]]
module = ["chronos.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# M17's tests run in their own process. torch and lightgbm each load an OpenMP runtime, and
# on macOS the two together segfault the interpreter partway through a combined run — the
# suite passes as 201 without them and as 3 on its own, and crashes only when both are in
# one process. Masking it with KMP_DUPLICATE_LIB_OK risks silent memory corruption, so the
# optional extra is simply kept out of the default run: `make test-foundation`.
addopts = "-m 'not foundation'"
markers = [
    "foundation: optional M17 foundation-model tests; require chronos-forecasting",
]
