services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delphi
      POSTGRES_USER: delphi
      POSTGRES_PASSWORD: delphi
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delphi -d delphi"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - delphi-postgres:/var/lib/postgresql/data

volumes:
  delphi-postgres:

